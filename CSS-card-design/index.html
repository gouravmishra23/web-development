<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Card Design</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Baloo+Bhai+2&family=Poppins:wght@300&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: gray;
            padding: 45px;
            display: flex;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
        }

        .card {
            background-color: white;
            width: 200px;
            border-radius: 7px;
            padding-bottom: 20px;
        }

        .image {
            padding: 6px;
        }

        .image img {
            width: 100%;
            border-radius: 7px;
            display: block;
        }

        .capsules {
            padding: 0 10px;
        }

        .capsules span {
            border: 1px solid gray;
            padding: 0 6px;
            border-radius: 7px;
            font-size: 8px;
            font-family: 'Baloo Bhai 2', sans-serif;
        }

        .content {
            padding: 7px 10px;
        }

        .content h2 {
            font-size: 16px;
        }

        .content p {
            font-size: 9px;
            color: gray;
            margin-top: 4px;
        }

        .button {
            text-align: center;
            margin-top: 10px;
        }

        .button button {
            padding: 6px 16px;
            border-radius: 15px;
            background-color: #d8ecfd;
            color: #0e96ea;
            font-size: 10px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .button button:hover {
            background-color: #c2e1f6;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="image">
            <img src="nature.jpg" alt="Scenic nature landscape with lake and trees">
        </div>
        <div class="capsules">
            <span>Nature</span>
            <span>Lake</span>
        </div>
        <div class="content">
            <h2>Gourav</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quas nemo numquam vel cumque ullam alias sequi
                suscipit velit!</p>
        </div>
        <div class="button">
            <button>Read More</button>
        </div>
    </div>
</body>

</html>
